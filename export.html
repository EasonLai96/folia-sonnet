<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folia Export</title>
    <style>
        /*
         * 整页必须透明：这一页是**离屏渲染**用的，背景透出来才能拿到 alpha。
         * 底下的底色由导出参数决定（见 ExportRenderConfig.backgroundColor）。
         */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        #export-root {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
    </style>
    <script>
        /*
         * 这一段必须**内联、并且在 bundle 之前**。
         *
         * 这一页是离屏的：原生那边只能靠 evaluateJavascript 问到几个值，看不到 console、
         * 也拿不到任何堆栈。页面一旦挂了（module 解析失败、顶层 throw、资源 404），
         * 表现就是「20 秒没等到就绪信号」，而真实原因一个字都看不见。
         * 所以这里先记错、先起 rAF 心跳，让原生在报错那一刻能把它读回去。
         */
        window.__foliaExportErrors = [];
        window.__foliaExportRafTicks = 0;

        /*
         * 必须走**捕获阶段**：资源（script/link）加载失败不冒泡，只有捕获才收得到，
         * 而"某个 chunk 404"正是最容易发生又最难看出来的那种失败。
         */
        window.addEventListener('error', function (event) {
            if (event.target && event.target !== window && event.target.tagName) {
                window.__foliaExportErrors.push('resource:' + String(event.target.src || event.target.href));
                return;
            }
            window.__foliaExportErrors.push(
                'error:' + String(event.message || '') + ' @ ' +
                String(event.filename || '') + ':' + String(event.lineno || 0));
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
            var reason = event.reason;
            window.__foliaExportErrors.push(
                'rejection:' + (reason && reason.message ? reason.message : String(reason)));
        });

        /*
         * rAF 心跳。原生拿它判断「这一页还算不算活着的」 ——
         * 页面一旦被判定不可见，rAF 就停，之后推帧只会得到一串永不推进的计数。
         */
        (function tick() {
            window.__foliaExportRafTicks += 1;
            requestAnimationFrame(tick);
        })();

        window.__foliaExportDiag = function () {
            try {
                var scripts = [];
                for (var i = 0; i < document.scripts.length; i += 1) {
                    scripts.push(String(document.scripts[i].src || '(inline)'));
                }
                return JSON.stringify({
                    url: String(window.location.href),
                    readyState: String(document.readyState),
                    visibility: String(document.visibilityState),
                    hidden: Boolean(document.hidden),
                    hasApi: Boolean(window.__foliaExport),
                    hasReady: Boolean(window.__foliaExportReady),
                    hasPainted: Boolean(window.__foliaExportPainted),
                    hasRoot: Boolean(document.getElementById('export-root')),
                    hasConfig: Boolean(window.localStorage
                        && window.localStorage.getItem('folia_export_config_v1')),
                    stamp: Number(window.__foliaExportFrameStamp || 0),
                    raf: Number(window.__foliaExportRafTicks || 0),
                    scripts: scripts,
                    errors: (window.__foliaExportErrors || []).slice(0, 5)
                });
            } catch (error) {
                return JSON.stringify({ diagError: String(error) });
            }
        };
    </script>
    <script type="module" src="/src/entries/exportSurface.tsx"></script>
</head>
<body>
    <div id="export-root"></div>
</body>
</html>
